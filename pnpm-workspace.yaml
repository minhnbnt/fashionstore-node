packages:
  - apps/*
  - apps/embed-worker/native-runtime

# pnpm không export .npmrc thành npm_config_* cho lifecycle script, nên cờ
# ONNXRUNTIME_NODE_INSTALL=skip không đặt qua .npmrc được. Cách pnpm-native:
# cấm luôn postinstall của onnxruntime-node — script này chỉ tải provider CUDA
# (~221MB); binary CPU nằm sẵn trong npm tarball.
strictDepBuilds: false
allowBuilds:
  esbuild: true
  onnxruntime-node: false
  protobufjs: true
  sharp: true

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
overrides:
  vite@*: "catalog:"
