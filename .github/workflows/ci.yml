name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push embed-worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/embed-worker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/minhnbnt/fashionstore-embed-worker:latest
            ghcr.io/minhnbnt/fashionstore-embed-worker:${{ github.sha }}

      - name: Build and push ai-backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ai-backend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/minhnbnt/fashionstore-ai-backend:latest
            ghcr.io/minhnbnt/fashionstore-ai-backend:${{ github.sha }}
